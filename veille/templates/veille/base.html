<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}Veille AO{% endblock %}</title>
<style>
  :root { --fond:#f6f5f2; --carte:#fff; --texte:#1f2328; --doux:#626a73; --bord:#e1ded8;
          --accent:#b3261e; --vert:#1f7a3a; --orange:#b26a00; --rouge:#b3261e; --gris:#8a8f96; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--fond); color:var(--texte); }
  header { background:#fff; border-bottom:1px solid var(--bord); padding:10px 20px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  header strong { color:var(--accent); font-size:17px; }
  header a { color:var(--texte); text-decoration:none; }
  header a:hover { text-decoration:underline; }
  main { max-width:1200px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:0 0 14px; }
  h2 { font-size:17px; margin:22px 0 8px; }
  .carte { background:var(--carte); border:1px solid var(--bord); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--bord); border-radius:8px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--bord); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--doux); background:#faf9f7; }
  tr:hover td { background:#fbfaf8; }
  a { color:#0b5cad; }
  .score { display:inline-block; min-width:38px; text-align:center; font-weight:700; border-radius:6px; padding:2px 6px; color:#fff; }
  .vert { background:var(--vert); } .orange { background:var(--orange); } .rouge { background:var(--rouge); } .gris { background:var(--gris); }
  .doux { color:var(--doux); font-size:13px; }
  .pastille { display:inline-block; font-size:12px; padding:1px 8px; border-radius:20px; border:1px solid var(--bord); background:#faf9f7; }
  .urgent { color:var(--rouge); font-weight:600; }
  form.filtres { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
  input, select, textarea { font:inherit; padding:6px 8px; border:1px solid var(--bord); border-radius:6px; background:#fff; }
  textarea { width:100%; }
  button, .bouton { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; text-decoration:none; display:inline-block; }
  button.secondaire, .bouton.secondaire { background:#fff; color:var(--accent); }
  .messages { list-style:none; padding:0; }
  .messages li { padding:8px 12px; border-radius:6px; margin-bottom:8px; background:#eef6ee; border:1px solid #cfe5cf; }
  .messages li.warning, .messages li.error { background:#fff4e5; border-color:#f1d4a6; }
  .grille { display:grid; grid-template-columns: 2fr 1fr; gap:16px; }
  .kanban { display:grid; grid-template-columns: repeat(6, minmax(180px, 1fr)); gap:10px; overflow-x:auto; }
  .colonne { background:#eceae5; border-radius:8px; padding:8px; min-height:200px; }
  .colonne h3 { font-size:13px; margin:2px 4px 8px; text-transform:uppercase; color:var(--doux); }
  .ticket { background:#fff; border:1px solid var(--bord); border-radius:6px; padding:8px; margin-bottom:8px; font-size:13px; }
  .critere { display:flex; gap:8px; padding:4px 0; }
  .eval-favorable { color:var(--vert); } .eval-defavorable { color:var(--orange); } .eval-eliminatoire { color:var(--rouge); font-weight:700; } .eval-neutre { color:var(--doux); }
  pre.texte { white-space:pre-wrap; font:13px/1.5 system-ui, sans-serif; background:#faf9f7; border:1px solid var(--bord); border-radius:6px; padding:10px; max-height:420px; overflow:auto; }
  @media (max-width: 800px) { .grille { grid-template-columns:1fr; } table { font-size:13px; } .masquer-mobile { display:none; } }
</style>
</head>
<body>
<header>
  <strong>Veille AO</strong>
  <a href="{% url 'tableau' %}">Appels d'offres</a>
  <a href="{% url 'pipeline' %}">Pipeline</a>
  <a href="{% url 'ajouter' %}">+ Consultation privée</a>
  <a href="{% url 'admin:index' %}">Paramètres</a>
</header>
<main>
  {% if messages %}<ul class="messages">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
  {% block contenu %}{% endblock %}
</main>
</body>
</html>
