:root {
  --encre: #16221D;
  --encre-douce: #55635D;
  --fond: #F1F4F2;
  --surface: #FFFFFF;
  --surface-2: #F7F9F8;
  --trait: #D8DFDB;
  --trait-fort: #B9C4BE;
  --vert: #0A7F4F;
  --vert-fonce: #06623C;
  --vert-action: #0A7F4F;
  --vert-pale: #E3F2EA;
  --rouge: #C62828;
  --rouge-pale: #FBE9E7;
  --rouge-trait: #E9B7B2;
  --jaune: #E0A100;
  --jaune-pale: #FFF6DB;
  --jaune-texte: #7A5600;
  --bleu: #1D5FA8;
  --gris: #8A958F;
  --colonne: #E4E9E6;
  --rail: #16221D;
  --rail-texte: #D6DFDA;
  --rail-doux: #9FB0A8;
  --ombre: rgba(22, 34, 29, .16);
  --surlignage: #FFF176;
  --titre: "Barlow", "Arial Narrow", system-ui, sans-serif;
  --texte: "Atkinson", system-ui, -apple-system, "Segoe UI", sans-serif;
  --rayon: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --encre: #E4ECE7; --encre-douce: #A3B2AA; --fond: #0F1713; --surface: #17221D; --surface-2: #1C2A24;
    --trait: #2A3832; --trait-fort: #3D4D46; --vert: #2FA56E; --vert-fonce: #3DBF82; --vert-pale: #173A2A; --vert-action: #12804E;
    --rouge: #EF6A62; --rouge-pale: #3A1D1B; --rouge-trait: #6B2D29; --jaune: #E8B020; --jaune-pale: #3A3013; --jaune-texte: #F2CC66;
    --bleu: #7FB0EC; --gris: #77857E; --colonne: #131D19; --rail: #0A110E; --ombre: rgba(0, 0, 0, .5); --surlignage: #7A6A12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --encre: #E4ECE7; --encre-douce: #A3B2AA; --fond: #0F1713; --surface: #17221D; --surface-2: #1C2A24;
  --trait: #2A3832; --trait-fort: #3D4D46; --vert: #2FA56E; --vert-fonce: #3DBF82; --vert-pale: #173A2A; --vert-action: #12804E;
  --rouge: #EF6A62; --rouge-pale: #3A1D1B; --rouge-trait: #6B2D29; --jaune: #E8B020; --jaune-pale: #3A3013; --jaune-texte: #F2CC66;
  --bleu: #7FB0EC; --gris: #77857E; --colonne: #131D19; --rail: #0A110E; --ombre: rgba(0, 0, 0, .5); --surlignage: #7A6A12;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 16px/1.55 var(--texte); }
a { color: var(--bleu); text-underline-offset: 2px; }
a:hover { color: var(--encre); }
:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--titre); line-height: 1.15; margin: 0; letter-spacing: -.005em; text-wrap: balance; }
h1 { font-size: 30px; font-weight: 700; }
h2 { font-size: 21px; font-weight: 600; margin: 28px 0 10px; }
h3 { font-size: 17px; font-weight: 600; margin: 18px 0 6px; }
p { margin: 0 0 10px; }
.doux { color: var(--encre-douce); font-size: 14px; }
.petit { font-size: 14px; }
.urgent { color: var(--rouge); font-weight: 700; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
/* Les libellés masqués (positionnés) doivent rester dans leur zone de défilement. */
.kanban, .tableau, .onglets { position: relative; }
.evitement { position: absolute; left: -999px; top: 8px; z-index: 50; background: var(--surface); padding: 8px 12px; border-radius: 6px; }
.evitement:focus { left: 8px; }
.icone { flex: none; }
kbd { font: 600 12px var(--titre); border: 1px solid var(--trait-fort); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--encre-douce); background: var(--surface-2); }

/* ---------- Structure ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--rail) 232px, var(--fond) 232px); }
.rail { background: var(--rail); color: var(--rail-texte); padding: 20px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 3px; }
.marque { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; color: #fff; text-decoration: none; }
.marque:hover { color: #fff; }
.marque-signe { flex: none; width: 34px; height: 34px; border-radius: 7px; background: var(--vert); box-shadow: inset 0 0 0 2.5px var(--rail), inset 0 0 0 4px #fff; display: grid; place-items: center; }
.marque-nom { font-family: var(--titre); font-weight: 700; font-size: 20px; line-height: 1; }
.marque-nom small { display: block; font-weight: 500; font-size: 12.5px; color: var(--rail-doux); margin-top: 4px; }
.rail a.nav { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 7px; color: var(--rail-texte); text-decoration: none; font-family: var(--titre); font-weight: 600; font-size: 16px; }
.rail a.nav .nav-libelle { flex: 1; }
.rail a.nav:hover { background: rgba(255,255,255,.07); color: #fff; }
.rail a.nav[aria-current="page"] { background: rgba(255,255,255,.12); color: #fff; box-shadow: inset 3px 0 0 var(--vert); }
.compteur { font-family: var(--titre); font-size: 13px; font-weight: 600; min-width: 24px; text-align: center; padding: 1px 7px; border-radius: 10px; background: rgba(255,255,255,.14); color: #fff; }
.compteur.vif { background: #E0A100; color: #16221D; }
.rail-bas { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid rgba(255,255,255,.12); font-size: 13px; color: var(--rail-doux); display: grid; gap: 6px; }
.rail-bas a, .rail-bas .lien-btn { color: #C9D4CF; font-size: 13px; }
.ia { display: flex; align-items: center; gap: 7px; }
.ia::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gris); }
.ia.on::before { background: #3DDC84; }

.principal { min-width: 0; display: flex; flex-direction: column; }
.barre-haut { position: sticky; top: 0; z-index: 8; display: flex; align-items: center; gap: 12px; padding: 12px 36px; background: color-mix(in srgb, var(--fond) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--trait); }
.recherche-globale { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--trait-fort); border-radius: 9px; padding: 0 10px; color: var(--encre-douce); }
.recherche-globale:focus-within { border-color: var(--bleu); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bleu) 22%, transparent); }
.recherche-globale input { flex: 1; border: 0; background: transparent; padding: 9px 0; box-shadow: none; outline: none; }
.utilisateur { margin-left: auto; font-family: var(--titre); font-weight: 600; color: var(--encre-douce); }
.barre-haut .btn { margin-left: auto; }
.barre-haut .btn + .utilisateur { margin-left: 4px; }
.contenu { padding: 28px 36px 80px; max-width: 1280px; width: 100%; outline: none; }
.entete-page { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.entete-page p { margin: 6px 0 0; }
.fil { font-size: 14px; margin-bottom: 10px; }
.fil a { color: var(--encre-douce); }

/* ---------- La plaque de score ---------- */
.plaque { --c: var(--gris); flex: none; width: 54px; height: 54px; border-radius: 9px; background: var(--c); color: #fff;
  box-shadow: inset 0 0 0 3px var(--c), inset 0 0 0 5px #fff; display: grid; place-items: center;
  font: 700 23px/1 var(--titre); font-variant-numeric: tabular-nums; }
.plaque.vert { --c: #0A7F4F; }
.plaque.orange { --c: #E0A100; color: #16221D; }
.plaque.rouge { --c: #C62828; }
.plaque.gris { --c: #8A958F; font-size: 20px; }
.plaque.grande { width: 84px; height: 84px; border-radius: 13px; font-size: 38px; box-shadow: inset 0 0 0 4px var(--c), inset 0 0 0 7px #fff; }
.plaque.petite { width: 40px; height: 40px; border-radius: 7px; font-size: 17px; box-shadow: inset 0 0 0 2.5px var(--c), inset 0 0 0 4px #fff; }
.plaque.mini { width: 34px; height: 34px; border-radius: 6px; font-size: 15px; box-shadow: inset 0 0 0 2px var(--c), inset 0 0 0 3.5px #fff; }
.verdict { font-family: var(--titre); font-weight: 700; font-size: 15px; }
.verdict.GO { color: var(--vert-fonce); } .verdict.A_ETUDIER { color: var(--jaune-texte); } .verdict.NO_GO { color: var(--rouge); }

/* ---------- Boutons et champs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font: 600 15px/1 var(--titre); letter-spacing: .01em;
  padding: 10px 16px; border-radius: 8px; border: 1.5px solid var(--vert-action); background: var(--vert-action); color: #fff; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--vert-fonce); border-color: var(--vert-fonce); color: #fff; }
.btn.secondaire { background: var(--surface); color: var(--encre); border-color: var(--trait-fort); }
.btn.secondaire:hover { border-color: var(--encre); color: var(--encre); }
.btn.nogo { background: var(--surface); color: var(--rouge); border-color: var(--rouge-trait); }
.btn.nogo:hover { background: var(--rouge-pale); border-color: var(--rouge); }
.btn.petit { padding: 7px 11px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.lien-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--bleu); text-decoration: underline; cursor: pointer; }
input, select, textarea { font: inherit; font-size: 15px; color: var(--encre); padding: 8px 10px; border: 1.5px solid var(--trait-fort); border-radius: 8px; background: var(--surface); max-width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--bleu); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--bleu) 22%, transparent); }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--vert); vertical-align: -3px; }
textarea { width: 100%; line-height: 1.5; }

/* ---------- Messages ---------- */
.messages { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; }
.messages li { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px; background: var(--vert-pale); border-left: 4px solid var(--vert); transition: opacity .25s, transform .25s; }
.messages li > span { flex: 1; }
.messages li form { margin: 0; }
.messages li.sort { opacity: 0; transform: translateY(-4px); }
.messages li.warning, .messages li.info { background: var(--jaune-pale); border-left-color: var(--jaune); }
.messages li.error { background: var(--rouge-pale); border-left-color: var(--rouge); }
.fermer { background: none; border: 0; font-size: 20px; line-height: 1; color: var(--encre-douce); cursor: pointer; padding: 0 2px; }

/* ---------- Accueil : widgets ---------- */
.widgets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; grid-auto-flow: row dense; }
.widget { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 16px 18px 18px; min-width: 0; }
.widget.large { grid-column: span 2; }
.widget-entete { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.widget-entete h2 { margin: 0; font-size: 19px; }
.widget-entete a { font-size: 14px; white-space: nowrap; }
.mini-liste { list-style: none; margin: 0; padding: 0; }
.mini-liste li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--trait); }
.mini-liste.compacte li { grid-template-columns: minmax(0, 1fr); padding: 8px 0; }
.mini-texte { min-width: 0; display: grid; }
.mini-titre { font-family: var(--titre); font-weight: 600; font-size: 16px; color: var(--encre); text-decoration: none; line-height: 1.25; }
.mini-titre:hover { text-decoration: underline; }
.vide-widget { color: var(--encre-douce); font-size: 15px; padding: 10px 0; }
.vide-widget strong { display: block; color: var(--encre); font-family: var(--titre); font-size: 17px; margin-bottom: 2px; }
.frise { list-style: none; margin: 0; padding: 0; }
.frise li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--trait); }
.frise li div { display: grid; min-width: 0; }
.frise-j { font: 700 18px var(--titre); font-variant-numeric: tabular-nums; }
.frise li.proche .frise-j { color: var(--rouge); }
.barre-etapes { display: flex; gap: 3px; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); margin-bottom: 10px; }
.seg-GO, .pastille-c.seg-GO { background: #0A7F4F; } .seg-REDACTION, .pastille-c.seg-REDACTION { background: #1D5FA8; } .seg-DEPOSE, .pastille-c.seg-DEPOSE { background: #8A958F; }
.legende { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 6px; padding: 0; font-size: 14px; color: var(--encre-douce); }
.legende b { color: var(--encre); margin-left: 3px; }
.pastille-c { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.indicateurs { display: flex; gap: 28px; flex-wrap: wrap; margin: 0 0 12px; }
.indicateurs dt { font-size: 14px; color: var(--encre-douce); }
.indicateurs dd { margin: 0; font: 700 30px/1.1 var(--titre); font-variant-numeric: tabular-nums; }
.indicateurs dd.ok { color: var(--vert); }
.graphique { margin: 0; }
.graphique svg { width: 100%; height: auto; display: block; }
.graphique .axe { stroke: var(--trait-fort); stroke-width: 1; }
.barre-retenus { fill: color-mix(in srgb, var(--vert) 35%, var(--surface)); }
.pastille-c.barre-retenus { background: color-mix(in srgb, var(--vert) 35%, var(--surface)); }
.barre-retenus.weekend { fill: color-mix(in srgb, var(--vert) 18%, var(--surface)); }
.barre-go { fill: var(--vert); }
.pastille-c.barre-go { background: var(--vert); }
.etiquette { font: 500 12px var(--titre); fill: var(--encre-douce); }
.resume-tri { display: flex; gap: 8px 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 4px; }
.resume-tri p { margin: 0; }
.graphique .legende { margin-top: 8px; }
.jauge { height: 10px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--trait); overflow: hidden; margin-bottom: 10px; }
.jauge span { display: block; height: 100%; background: var(--vert); border-radius: 5px; min-width: 4px; }
.etat-veille { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; font-size: 15px; }
.etat-veille li { display: flex; gap: 10px; align-items: baseline; }
.point { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--gris); transform: translateY(-1px); }
.point.ok { background: var(--vert); } .point.ko { background: var(--rouge); } .point.attente { background: var(--jaune); }

/* Personnalisation */
.personnaliser { margin-bottom: 20px; border: 2px solid var(--vert); scroll-margin-top: 84px; }
.personnaliser h2 { margin-top: 0; }
.liste-widgets { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.choix-widget { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--trait); border-radius: 8px; cursor: grab; }
.choix-widget.tire { opacity: .45; }
.poignee { color: var(--encre-douce); font-size: 18px; }
.choix-titre { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center; cursor: pointer; }
.choix-titre .doux { grid-column: 2; }
.choix-large { font-size: 14px; white-space: nowrap; cursor: pointer; }
.fleches { display: flex; gap: 4px; }

/* ---------- Onglets, recherche, bandeau ---------- */
.aujourdhui { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 22px; }
.signal { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 14px 16px; border-left: 5px solid var(--bleu); }
.signal.urgent { border-left-color: var(--rouge); font-weight: 400; color: var(--encre); }
.signal.attention { border-left-color: var(--jaune); }
.signal strong { font-family: var(--titre); font-size: 17px; display: block; margin-bottom: 4px; }
.signal ul { margin: 4px 0 0; padding-left: 18px; font-size: 14px; }
.barre { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-bottom: 2px solid var(--trait); margin-bottom: 4px; }
.onglets { display: flex; gap: 2px; overflow-x: auto; }
.onglets a { padding: 10px 14px; font: 600 16px var(--titre); color: var(--encre-douce); text-decoration: none; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.onglets a[aria-current="page"] { color: var(--encre); border-bottom-color: var(--vert); }
.onglets a span { font-size: 13px; color: var(--encre-douce); margin-left: 4px; }
.aide-clavier { font-size: 13px; color: var(--encre-douce); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- Liste de tri ---------- */
.liste { list-style: none; margin: 0; padding: 0; }
.ligne { display: grid; grid-template-columns: 54px minmax(0, 1fr) 96px auto; gap: 18px; align-items: start; padding: 18px 8px; border-bottom: 1px solid var(--trait); border-radius: 8px; }
.ligne:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
.ligne.choisie { background: var(--surface); box-shadow: inset 3px 0 0 var(--bleu); }
.ligne-titre { font-family: var(--titre); font-weight: 600; font-size: 18px; line-height: 1.25; color: var(--encre); text-decoration: none; }
.ligne-titre:hover { text-decoration: underline; }
.ligne-meta { font-size: 14px; color: var(--encre-douce); margin-top: 3px; }
.ligne-resume { font-size: 15px; margin-top: 6px; max-width: 72ch; }
.faits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fait { font-size: 13px; padding: 2px 9px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--trait); color: var(--encre); }
.fait.bon { background: var(--vert-pale); border-color: transparent; color: var(--vert-fonce); }
.fait.mauvais { background: var(--rouge-pale); border-color: transparent; color: var(--rouge); }
.echeance { text-align: right; font-family: var(--titre); }
.echeance b { display: block; font-size: 24px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.echeance span { font-size: 13px; color: var(--encre-douce); }
.echeance.urgent b { color: var(--rouge); }
.decision { display: flex; gap: 6px; align-items: flex-start; }
.decision form { margin: 0; }
details.nogo-motif { position: relative; }
details.nogo-motif summary { list-style: none; }
details.nogo-motif summary::-webkit-details-marker { display: none; }
details.nogo-motif[open] .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; width: 290px; background: var(--surface); border: 1px solid var(--trait-fort); border-radius: 9px; padding: 12px; box-shadow: 0 10px 28px var(--ombre); }
.pop label { font-size: 14px; display: block; margin-bottom: 6px; }
.pop input { width: 100%; margin-bottom: 8px; }
.vide { padding: 48px 20px; text-align: center; color: var(--encre-douce); grid-column: 1 / -1; }
.vide strong { display: block; font-family: var(--titre); font-size: 20px; color: var(--encre); margin-bottom: 6px; }

/* ---------- Fiche avis ---------- */
.onglets-avis { display: flex; gap: 2px; border-bottom: 2px solid var(--trait); margin: 18px 0 22px; }
.colonnes { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 28px; align-items: start; }
.panneau { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 18px 20px; margin-bottom: 16px; }
.panneau > h2:first-child, .panneau > h3:first-child, .panneau > input[type=hidden]:first-child + h2 { margin-top: 0; }
.collant { position: sticky; top: 76px; }
.avis-verdict { display: flex; gap: 18px; align-items: center; margin-bottom: 14px; }
.avis-verdict .verdict { font-size: 22px; display: block; }
.criteres { list-style: none; margin: 0; padding: 0; }
.criteres li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--trait); }
.criteres li:first-child { border-top: 0; }
.picto { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--titre); color: #fff; margin-top: 2px; }
.picto.favorable, .picto.remplie, .picto.ok, .picto.valide { background: #0A7F4F; }
.picto.neutre { background: #8A958F; }
.picto.defavorable, .picto.a_verifier, .picto.expiree, .picto.a_renouveler { background: #E0A100; color: #16221D; }
.picto.eliminatoire, .picto.non_remplie, .picto.manquante, .picto.a_faire, .picto.expire, .picto.manquant { background: #C62828; }
.picto.genere { background: #1D5FA8; }
.donnees { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 15px; }
.donnees dt { color: var(--encre-douce); }
.donnees dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.panneau, .widget, .ligne, .mini-texte, pre.texte { overflow-wrap: anywhere; }
ul.simple { margin: 4px 0 0; padding-left: 18px; }
ul.simple li { margin: 3px 0; }
pre.texte { white-space: pre-wrap; font: 14px/1.55 var(--texte); background: var(--surface-2); border: 1px solid var(--trait); border-radius: 8px; padding: 14px; max-height: 460px; overflow: auto; margin: 0; }
.formulaire p { margin: 0 0 12px; }
.formulaire label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.formulaire .helptext { display: block; font-size: 13px; color: var(--encre-douce); margin-top: 3px; }
.formulaire input:not([type=checkbox]), .formulaire select { width: 100%; }
.formulaire ul.errorlist { color: var(--rouge); margin: 4px 0; padding-left: 18px; font-size: 14px; }
details.repli > summary { cursor: pointer; font-family: var(--titre); font-weight: 600; font-size: 17px; margin: 18px 0 6px; }
details.repli > summary .doux { font-family: var(--texte); font-weight: 400; }

/* ---------- Parcours de réponse ---------- */
.etapes { list-style: none; margin: 0; padding: 0; counter-reset: etape; min-width: 0; }
.etape { position: relative; padding: 0 0 26px 52px; }
.etape::before { counter-increment: etape; content: counter(etape); position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--trait-fort); display: grid; place-items: center; font: 700 16px var(--titre); color: var(--encre-douce); }
.etape::after { content: ""; position: absolute; left: 17px; top: 38px; bottom: 4px; width: 2px; background: var(--trait); }
.etape:last-child::after { display: none; }
.etape.faite::before { content: "✓"; background: var(--vert); border-color: var(--vert); color: #fff; }
.etape.active::before { border-color: var(--vert); color: var(--vert); }
.etape > h2 { margin: 4px 0 8px; }
.tableau { width: 100%; border-collapse: collapse; font-size: 15px; }
.tableau th { text-align: left; font: 600 14px var(--titre); color: var(--encre-douce); padding: 6px 8px; border-bottom: 2px solid var(--trait); }
.tableau td { padding: 8px; border-bottom: 1px solid var(--trait); vertical-align: top; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.attente { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--jaune-pale); border-radius: 8px; }
.attente::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--jaune); border-right-color: transparent; animation: tourne 1s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
.depot { border: 2px dashed var(--trait-fort); border-radius: 8px; padding: 16px; background: var(--surface-2); }

/* ---------- Pipeline ---------- */
.kanban { display: grid; grid-template-columns: repeat(6, minmax(210px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.colonne { background: var(--colonne); border-radius: var(--rayon); padding: 10px; min-height: 240px; }
.colonne h2 { font-size: 16px; margin: 2px 4px 10px; display: flex; justify-content: space-between; }
.ticket { background: var(--surface); border: 1px solid var(--trait); border-radius: 8px; padding: 10px; margin-bottom: 8px; display: grid; grid-template-columns: 34px 1fr; gap: 10px; font-size: 14px; }
.ticket a { font-weight: 700; color: var(--encre); text-decoration: none; line-height: 1.3; }
.ticket a:hover { text-decoration: underline; }
.ticket select { font-size: 13px; padding: 3px 6px; margin-top: 6px; width: 100%; }

/* ---------- Mémoire ---------- */
.editeur { font: 15px/1.6 var(--texte); min-height: 70vh; }
.marque-completer { background: var(--surlignage); color: var(--encre); padding: 0 3px; border-radius: 3px; }

/* ---------- Connexion ---------- */
.connexion { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.connexion .panneau { width: 100%; max-width: 380px; padding: 28px; }
.connexion .marque { color: var(--encre); padding: 0 0 20px; }
.connexion .marque:hover { color: var(--encre); }
.connexion .marque-nom small { color: var(--encre-douce); }
.connexion .marque-signe { box-shadow: inset 0 0 0 2.5px var(--surface), inset 0 0 0 4px #fff; }

/* ---------- Tablette ---------- */
@media (max-width: 1180px) {
  .widgets { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* ---------- Téléphone : barre d'onglets en bas ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); background: var(--fond); }
  .rail { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 20; flex-direction: row; justify-content: space-around; gap: 0;
    padding: 6px max(6px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid rgba(255,255,255,.08); }
  .marque, .rail-bas { display: none; }
  .rail a.nav { flex: 1; flex-direction: column; gap: 3px; padding: 6px 2px; font-size: 11.5px; position: relative; text-align: center; }
  .rail a.nav .nav-libelle { flex: none; }
  .rail a.nav[aria-current="page"] { box-shadow: inset 0 2px 0 var(--vert); }
  .rail a.nav .compteur { position: absolute; top: 0; left: 50%; margin-left: 6px; font-size: 11px; min-width: 18px; padding: 0 5px; }
  .barre-haut { padding: 10px max(16px, env(safe-area-inset-left, 0px)); }
  .raccourci, .masque-mobile, .aide-clavier { display: none; }
  .barre-haut .btn { padding: 9px 11px; }
  .contenu { padding: 18px 16px 96px; }
  .widgets { grid-template-columns: minmax(0, 1fr); }
  .widget.large { grid-column: auto; }
  .mini-liste li { grid-template-columns: 40px minmax(0, 1fr); }
  .mini-liste li .decision { grid-column: 2; }
  .choix-widget { grid-template-columns: 22px minmax(0, 1fr); }
  .choix-large, .fleches { grid-column: 2; }
  .colonnes { grid-template-columns: minmax(0, 1fr); }
  .collant { position: static; }
  .ligne { grid-template-columns: 46px minmax(0, 1fr); gap: 12px; }
  .ligne .plaque { width: 46px; height: 46px; font-size: 20px; }
  .ligne .echeance { grid-column: 2; text-align: left; display: flex; gap: 8px; align-items: baseline; }
  .ligne .echeance b { font-size: 18px; }
  .ligne .decision { grid-column: 2; }
  .entete-page .actions { width: 100%; }
  .entete-page .actions .btn { flex: 1 1 auto; }
  .barre { flex-direction: column; align-items: stretch; flex-wrap: nowrap; }
  .tableau { display: block; overflow-x: auto; }
  h1 { font-size: 25px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }


/* ---------- Ajouts propres à la démo ---------- */
.bandeau-demo { display:flex; gap:8px 14px; align-items:center; flex-wrap:wrap; font-size:14px; padding:9px 14px; margin-bottom:18px; border-radius:8px; background:var(--surface); border:1px dashed var(--trait-fort); color:var(--encre-douce); }
.bandeau-demo strong { font-family:var(--titre); color:var(--encre); }
.bandeau-demo .lien-btn { margin-left:auto; }
dialog.apercu { border:1px solid var(--trait-fort); border-radius:12px; padding:0; background:var(--surface); color:var(--encre); width:min(880px, calc(100vw - 32px)); max-height:calc(100vh - 48px); }
dialog.apercu::backdrop { background:rgba(10,17,14,.55); }
.apercu-tete { display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 18px; border-bottom:1px solid var(--trait); position:sticky; top:0; background:var(--surface); }

<script>
"use strict";
/* ================= Constantes ================= */
const CLE = "formao-demo-v2";
const STATUTS = [["DETECTE","Détecté"],["A_QUALIFIER","À qualifier"],["GO","Go"],["NO_GO","No-Go"],["REDACTION","En rédaction"],["DEPOSE","Déposé"],["GAGNE","Gagné"],["PERDU","Perdu"],["SANS_SUITE","Sans suite"],["ECARTE","Écarté (hors cible)"]];
const ONGLETS = [["a-trier","À trier",["DETECTE","A_QUALIFIER"]],["go","Go",["GO"]],["en-cours","En cours",["REDACTION","DEPOSE"]],["resultats","Résultats",["GAGNE","PERDU","SANS_SUITE"]],["nogo","No-Go",["NO_GO"]]];
const PIPELINE = ["A_QUALIFIER","GO","REDACTION","DEPOSE","GAGNE","PERDU"];
const SOURCES = {BOAMP:"BOAMP", TED:"TED (JOUE)", PROFIL:"Profil acheteur", PRIVE:"Consultation privée", MANUEL:"Saisie manuelle"};
const ICONES = {
  accueil:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  ao:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  reponses:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  coffre:'<rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3"/><path d="M12 9.5V8M3 9h2M3 16h2"/>',
  profil:'<path d="M3 21V9l9-5 9 5v12"/><path d="M9 21v-6h6v6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  recherche:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  reglages:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
};
const icone = n => `<svg class="icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES[n] || ""}</svg>`;

let BASE = null, S = null, sample = null, downloads = null;
let recherche = "", persoOuvert = false;

/* ================= Utilitaires ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const trunc = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
function lisible(t) { t = String(t || "").split(/\s+/).join(" ").trim(); const l = [...t].filter(c => /\p{L}/u.test(c)); if (l.length && l.filter(c => c === c.toUpperCase() && c !== c.toLowerCase()).length / l.length > .8) { t = t.toLowerCase(); t = t.charAt(0).toUpperCase() + t.slice(1); } return t; }
function joursRestants(iso) { if (!iso) return null; const d = new Date(iso); d.setHours(0,0,0,0); const a = new Date(); a.setHours(0,0,0,0); return Math.round((d - a) / 864e5); }
function jMoins(j) { if (j == null) return ""; if (j < 0) return "Clos"; if (j === 0) return "Auj."; return "J-" + j; }
const ouvert = a => !a.date_limite || new Date(a.date_limite) >= new Date();
const couleur = s => s == null ? "gris" : s >= 70 ? "vert" : s >= 45 ? "orange" : "rouge";
const libReco = r => ({GO:"Go recommandé", A_ETUDIER:"À étudier", NO_GO:"No-Go recommandé"})[r] || "Non évalué";
const libStatut = c => (STATUTS.find(s => s[0] === c) || [c, c])[1];
function euros(v) { if (v == null || v === "") return ""; v = Number(v); if (v >= 1e6) return (v / 1e6).toFixed(1).replace(".", ",") + " M€ HT"; if (v >= 1000) return Math.round(v / 1000) + " k€ HT"; return Math.round(v) + " € HT"; }
function deps(c) { c = String(c || "").split(",").filter(Boolean); if (!c.length) return ""; return c.length > 4 ? c.length + " départements" : "dép. " + c.join(", "); }
const fdate = (iso, opt) => iso ? new Date(iso).toLocaleDateString("fr-FR", opt || {}) : "";
const fdh = iso => iso ? new Date(iso).toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"}) + ", " + new Date(iso).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"}).replace(":", "h") : "";
const plaque = (s, cls = "") => `<div class="plaque ${cls} ${couleur(s)}" title="Score ${s ?? "non calculé"}/100">${s ?? "?"}</div>`;
function md(t) { const h = window.marked ? marked.parse(t || "") : "<pre>" + esc(t) + "</pre>"; const s = window.DOMPurify ? DOMPurify.sanitize(h) : esc(t); return s.replace(/<table/g, '<div class="tw"><table').replace(/<\/table>/g, "</table></div>").replace(/\[À COMPLÉTER[^\]]*\]/g, m => `<mark>${m}</mark>`); }
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const nbACompleter = t => (String(t || "").match(/\[À COMPLÉTER/g) || []).length;

/* ================= État ================= */
function etatInitial() {
  const memoires = {};
  for (const [id, m] of Object.entries(BASE.memoires)) memoires[id] = { contenu: m.contenu, cree_le: m.cree_le, consignes: m.consignes, original: true };
  const analyses = {};
  for (const [id, x] of Object.entries(BASE.analyses)) analyses[id] = { resultat: x.resultat, original: true };
  return {
    avis: BASE.avis.map(a => { const c = { ...a }; delete c.documents; return c; }),
    entreprise: structuredClone(BASE.entreprise), pieces: [], analyses, memoires, dce: {},
    widgets: BASE.widgets.map(w => ({ cle: w.cle, visible: true, large: w.large })), prochainId: 900000
  };
}
function charger() { try { const s = JSON.parse(localStorage.getItem(CLE) || "null"); if (s && s.avis) return s; } catch (e) {} return etatInitial(); }
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) { message("Le navigateur n'a plus de place : cette modification ne sera pas gardée au prochain chargement.", "warning"); } }
const avisPar = id => S.avis.find(a => String(a.id) === String(id));
const docsDe = a => (BASE.avis.find(b => b.id === a.id) || {}).documents || {};

/* ================= Messages (avec Annuler) ================= */
function message(texte, niveau = "success", annuler = null) {
  const li = document.createElement("li"); li.className = niveau;
  li.innerHTML = `<span>${esc(texte)}</span>${annuler ? '<button class="lien-btn" type="button">Annuler</button>' : ""}<button class="fermer" type="button" aria-label="Fermer le message">×</button>`;
  const fermer = () => { li.classList.add("sort"); setTimeout(() => li.remove(), 250); };
  li.querySelector(".fermer").onclick = fermer;
  if (annuler) li.querySelector(".lien-btn").onclick = () => { fermer(); annuler(); };
  else setTimeout(fermer, 6000);
  $("#messages").prepend(li);
  while ($("#messages").children.length > 3) $("#messages").lastElementChild.remove();
}

/* ================= Capacités claude.ai ================= */
function capacites() {
  if (window.claude && claude.use) {
    claude.use("sample").then(s => { sample = s; majIA(); }).catch(majIA);
    claude.use("downloads").then(d => { downloads = d; }).catch(() => {});
  }
  setTimeout(majIA, 11000); majIA();
}
function majIA() { const el = $("#ia-etat"); el.classList.toggle("on", !!sample); el.textContent = sample ? "IA active (Claude)" : "IA inactive : score par règles"; }
function erreurIA(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled") { sample = null; majIA(); return "L'IA n'a pas été autorisée pour cette page. Le reste de la démo fonctionne sans elle."; }
  if (c === "rate_limited") return "Trop de demandes à l'IA pour l'instant. Réessayez dans un moment.";
  if (c === "cancelled") return "Arrêté.";
  if (c === "invalid_json") return "La réponse de l'IA n'était pas au bon format. Relancez.";
  return "L'IA n'a pas répondu. Relancez dans un instant.";
}
async function telecharger(nom, data) {
  if (!downloads) { message("Le téléchargement n'est pas disponible dans cette vue : ouvrez la démo sur claude.ai.", "warning"); return; }
  try { await downloads.save({ filename: nom, data }); message("Fichier enregistré : " + nom); }
  catch (e) { if (e && e.code !== "declined") message("Téléchargement impossible (" + (e.code || "erreur") + ").", "error"); }
}

/* ================= Navigation ================= */
function route() {
  const h = (location.hash || "#accueil").slice(1);
  const m = h.match(/^([a-z]+)(?:-(.+))?$/) || ["", "accueil"];
  const v = m[1], arg = m[2];
  const actif = { accueil:"accueil", ao:"ao", recherche:"ao", avis:"ao", reponses:"reponses", reponse:"reponses", memoire:"reponses", coffre:"coffre", profil:"profil" }[v];
  $$(".rail a.nav").forEach(a => a.dataset.nav === actif ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const vues = { accueil: () => vueAccueil(arg === "perso"), ao: () => vueTableau(arg || "a-trier"), recherche: () => vueTableau("a-trier", true),
    avis: () => vueAvis(arg), reponse: () => vueReponse(arg), memoire: () => vueMemoire(arg), reponses: vuePipeline, coffre: vueCoffre, profil: vueProfil, ajouter: vueAjouter };
  (vues[v] || vues.accueil)();
  compteursNav();
  if (!(v === "accueil" && arg === "perso")) window.scrollTo(0, 0);
}
function compteursNav() {
  const t = S.avis.filter(a => ["DETECTE","A_QUALIFIER"].includes(a.statut) && ouvert(a)).length;
  const c = S.avis.filter(a => ["GO","REDACTION","DEPOSE"].includes(a.statut)).length;
  const n1 = $("#nav-a-trier"), n2 = $("#nav-en-cours");
  n1.hidden = !t; n1.textContent = t; n1.title = t + " à trier"; n2.hidden = !c; n2.textContent = c;
}
const vue = html => { $("#vue").innerHTML = html; activerDecisions(); };

/* ================= Décision Go / No-Go ================= */
function decision(a) {
  return `<div class="decision" data-id="${a.id}">
    ${a.statut !== "GO" ? `<button class="btn petit" type="button" data-dec="GO">Go</button>` : ""}
    ${a.statut !== "NO_GO" ? `<details class="nogo-motif"><summary class="btn nogo petit">No-Go</summary><div class="pop"><form data-nogo>
      <label for="motif-${a.id}">Pourquoi ? (aide à mieux trier ensuite)</label>
      <input id="motif-${a.id}" name="motif" placeholder="ex. hors métier, trop gros, délai trop court">
      <button class="btn nogo petit">Classer No-Go</button></form></div></details>` : ""}
    ${a.statut === "GO" || a.statut === "NO_GO" ? `<button class="btn secondaire petit" type="button" data-dec="A_QUALIFIER" title="Remettre dans « À trier »">Annuler</button>` : ""}
  </div>`;
}
function decider(id, dec, motif, annulation) {
  const a = avisPar(id); if (!a) return;
  const prec = a.statut; a.statut = dec; if (motif) a.decision_motif = motif; sauver();
  const lib = { GO: "Go", NO_GO: "No-Go", A_QUALIFIER: "à trier" }[dec] || libStatut(dec);
  if (annulation) message(`Décision annulée : « ${trunc(a.objet, 70)} » revient à l'étape « ${libStatut(dec)} ».`);
  else message(`« ${trunc(a.objet, 70)} » classé ${lib}.`, "success", () => decider(id, prec, null, true));
  route();
}
function activerDecisions() {
  $$("#vue .decision").forEach(d => {
    const id = d.dataset.id;
    $$("[data-dec]", d).forEach(b => b.onclick = () => decider(id, b.dataset.dec));
    const f = $("[data-nogo]", d); if (f) f.onsubmit = e => { e.preventDefault(); decider(id, "NO_GO", f.motif.value.trim()); };
    const det = $("details.nogo-motif", d);
    if (det) det.addEventListener("toggle", () => { if (det.open) { $$("details.nogo-motif[open]").forEach(x => { if (x !== det) x.open = false; }); setTimeout(() => $("input", det).focus(), 0); } });
  });
}
document.addEventListener("click", e => $$("details.nogo-motif[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; }));

/* ================= Accueil ================= */
const W = {};
W.a_trier = () => {
  const qs = S.avis.filter(a => ["DETECTE","A_QUALIFIER"].includes(a.statut) && ouvert(a));
  const liste = qs.filter(a => a.recommandation !== "NO_GO").sort((x, y) => (y.score ?? -1) - (x.score ?? -1)).slice(0, 5);
  const go = qs.filter(a => a.recommandation === "GO").length, ng = qs.filter(a => a.recommandation === "NO_GO" && a.score_modele !== "règles").length;
  return { lien: `<a href="#ao">Tout voir (${qs.length})</a>`, html: liste.length ? `
    <div class="resume-tri"><p class="doux">${qs.length} avis en attente de décision, dont ${go} Go recommandé${go > 1 ? "s" : ""} par l'IA${ng ? ` et ${ng} que l'IA propose d'écarter` : ""}.</p>
    ${ng ? `<button class="btn secondaire petit" type="button" data-ecarter>Écarter les ${ng} No-Go recommandés</button>` : ""}</div>
    <ul class="mini-liste">${liste.map(a => { const j = joursRestants(a.date_limite); return `<li>${plaque(a.score, "petite")}
      <div class="mini-texte"><a class="mini-titre" href="#avis-${a.id}">${esc(trunc(lisible(a.objet), 95))}</a><span class="doux">${esc(trunc(a.acheteur, 45))}${a.date_limite ? `, <span class="${j < 10 ? "urgent" : ""}">${jMoins(j)}</span>` : ""}</span></div>
      ${decision(a)}</li>`; }).join("")}</ul>` : `<div class="vide-widget"><strong>Tout est trié</strong>Les nouveaux avis arrivent chaque matin, ou tout de suite avec « Collecter maintenant ».</div>` };
};
W.echeances = () => {
  const l = S.avis.filter(a => ["GO","REDACTION","DEPOSE"].includes(a.statut) && a.date_limite && ouvert(a)).sort((x, y) => new Date(x.date_limite) - new Date(y.date_limite)).slice(0, 6);
  return { lien: `<a href="#reponses">Toutes les réponses</a>`, html: l.length ? `<ol class="frise">${l.map(a => { const j = joursRestants(a.date_limite); return `<li class="${j < 7 ? "proche" : ""}"><span class="frise-j">${jMoins(j)}</span><div><a href="#reponse-${a.id}">${esc(trunc(lisible(a.objet), 70))}</a><span class="doux">${new Date(a.date_limite).toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"})}, ${new Date(a.date_limite).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"}).replace(":", "h")} – ${libStatut(a.statut)}</span></div></li>`; }).join("")}</ol>`
    : `<div class="vide-widget"><strong>Aucune échéance</strong>Classez un appel d'offres en Go pour suivre sa date limite ici.</div>` };
};
W.reponses = () => {
  const et = [["GO","Go"],["REDACTION","En rédaction"],["DEPOSE","Déposé"]].map(([c, l]) => ({ c, l, n: S.avis.filter(a => a.statut === c).length }));
  const tot = et.reduce((s, e) => s + e.n, 0);
  const l = S.avis.filter(a => ["GO","REDACTION","DEPOSE"].includes(a.statut)).sort((x, y) => new Date(x.date_limite || "2999") - new Date(y.date_limite || "2999")).slice(0, 4);
  return { lien: `<a href="#reponses">Toutes les réponses</a>`, html: tot ? `
    <div class="barre-etapes" role="img" aria-label="${et.map(e => e.l + " : " + e.n).join(", ")}">${et.filter(e => e.n).map(e => `<span class="seg seg-${e.c}" style="flex:${e.n}"></span>`).join("")}</div>
    <ul class="legende">${et.map(e => `<li><span class="pastille-c seg-${e.c}"></span>${e.l} <b>${e.n}</b></li>`).join("")}</ul>
    <ul class="mini-liste compacte">${l.map(a => `<li><div class="mini-texte"><a class="mini-titre" href="#reponse-${a.id}">${esc(trunc(lisible(a.objet), 70))}</a><span class="doux">${libStatut(a.statut)}${a.date_limite ? ", " + jMoins(joursRestants(a.date_limite)) : ""}${a.responsable ? ", " + esc(a.responsable) : ""}</span></div></li>`).join("")}</ul>`
    : `<div class="vide-widget"><strong>Aucune réponse en cours</strong>Les dossiers en Go apparaîtront ici jusqu'au dépôt.</div>` };
};
W.activite = () => {
  const jours = 14, fin = new Date(BASE.exporte_le); fin.setHours(0,0,0,0);
  const debut = new Date(fin); debut.setDate(debut.getDate() - jours + 1);
  const serie = [];
  for (let i = 0; i < jours; i++) { const d = new Date(debut); d.setDate(d.getDate() + i); const k = d.toISOString().slice(0, 10);
    const l = S.avis.filter(a => (a.date_publication || "").slice(0, 10) === k); serie.push({ d, retenus: l.length, go: l.filter(a => a.recommandation === "GO").length }); }
  const maxi = Math.max(1, ...serie.map(s => s.retenus)), L = 560, H = 130, M = 18, pas = L / jours;

const SCHEMA_SCORE = `{"score": entier 0-100, "recommandation": "GO"|"A_ETUDIER"|"NO_GO", "resume": "ce que l'acheteur veut, 2-3 phrases", "pourquoi": "1-2 phrases", "criteres": [{"critere": "Adéquation métier", "evaluation": "favorable"|"neutre"|"defavorable"|"eliminatoire", "commentaire": "une phrase"}] (les 7 critères du barème), "prestations_concernees": ["intitulés exacts de NOTRE catalogue"], "part_du_besoin_couverte": "totale"|"majoritaire"|"partielle"|"marginale"|"aucune", "lots_a_viser": [], "exigences_bloquantes": [], "concurrence_estimee": "faible"|"moyenne"|"forte"|"inconnue", "points_de_vigilance": [], "questions_a_verifier": []}`;
function texteAvis(a) {
  return `Objet : ${a.objet}\nAcheteur : ${a.acheteur} (${a.acheteur_type || "type non précisé"})\nSource : ${SOURCES[a.source] || a.source}\nDate limite : ${a.date_limite ? fdh(a.date_limite) : "non précisée"}\nLieu : ${a.lieu_execution || a.departements || "non précisé"}\nMontant estimé : ${a.montant_estime || "non précisé"}\nProcédure : ${a.procedure || "non précisée"}\n\nTexte :\n${(a.texte || "").slice(0, 30000)}\n\n(Nous sommes le ${new Date().toLocaleDateString("fr-FR")}.)`;
}
function scoreRegles(a) {
  const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’'\-]/g, " ");
  const v = BASE.veille[0] || {}, txt = norm(a.objet + " " + a.texte);
  const mots = s => [...new Set((s || "").split(/[\n,]/).map(x => norm(x.trim().replace(/\*$/, ""))).filter(x => x.length > 2))];
  const forts = mots(v.mots_cles_forts).filter(m => txt.includes(m)), gen = mots(v.mots_cles).filter(m => txt.includes(m));
  const ctx = mots(v.mots_contexte).filter(m => txt.includes(m)), exclus = mots(v.mots_cles_exclus).filter(m => norm(a.objet).includes(m));
  let s = Math.min(70, forts.length * 25 + (ctx.length ? gen.length * 12 + 10 : 0)); if (exclus.length) s = Math.min(s, 20);
  return { score: s, recommandation: s >= 45 ? "A_ETUDIER" : "NO_GO", resume: "", modele: "règles",
    pourquoi: forts.length || gen.length ? `Mots-clés trouvés : ${[...forts, ...gen].join(", ")}. Score plafonné à 70 sans IA.` : "Aucun mot-clé du profil de veille trouvé.",
    criteres: [{ critere: "Mots-clés forts", evaluation: forts.length ? "favorable" : "neutre", commentaire: forts.join(", ") || "aucun" },
      { critere: "Mots-clés avec contexte de formation", evaluation: gen.length && ctx.length ? "favorable" : "neutre", commentaire: (gen.join(", ") || "aucun") + (ctx.length ? " · contexte : " + ctx.join(", ") : "") },
      { critere: "Exclusions", evaluation: exclus.length ? "eliminatoire" : "favorable", commentaire: exclus.join(", ") || "aucune" }],
    prestations_concernees: [], part_du_besoin_couverte: "partielle", lots_a_viser: [], exigences_bloquantes: [], concurrence_estimee: "inconnue",
    points_de_vigilance: ["Score calculé sans IA : à confirmer en lisant l'avis."], questions_a_verifier: [] };
}
async function noter(a, zone) {
  let d = null, modele = "règles";
  if (sample) {
    zone.innerHTML = `<div class="attente" style="margin-top:12px">L'IA lit l'avis et le compare au profil FORMA'ST (20 à 60 secondes)…</div>`;
    try { d = await sample.json(`${BASE.prompts.profil}\n\n${BASE.prompts.regles}\n\nÉvalue cet avis de marché :\n\n${texteAvis(a)}\n\nRéponds uniquement avec un objet JSON de cette forme :\n${SCHEMA_SCORE}`, { cache: false });
      if (typeof d?.score !== "number") throw { code: "invalid_json" }; modele = "claude"; }
    catch (e) { message(erreurIA(e) + " Score calculé par règles.", "warning"); d = null; }
  }
  if (!d) d = scoreRegles(a);
  Object.assign(a, { score: Math.max(0, Math.min(100, Math.round(d.score))), recommandation: d.recommandation, resume: d.resume || a.resume, score_details: d, score_modele: modele, score_le: new Date().toISOString() });
  if (a.statut === "DETECTE") a.statut = "A_QUALIFIER";
  sauver(); message(`Score : ${a.score}/100 – ${libReco(a.recommandation)}${modele === "règles" ? " (par règles)" : ""}.`);
}

function controles(a) {
  const jour = a.date_limite ? a.date_limite.slice(0, 10) : new Date().toISOString().slice(0, 10);
  return BASE.pieces_attendues.filter(([t]) => !(t === "INRS" && !S.entreprise.habilitation_inrs_sst)).map(([t, l]) => {
    const p = S.pieces.filter(x => x.type === t && x.nom_fichier).sort((x, y) => (y.date_expiration || "9999") < (x.date_expiration || "9999") ? -1 : 1)[0];
    if (!p) return { type: t, libelle: l, statut: "manquante", detail: "Pas de fichier dans le coffre-fort" };

  <div class="entete-page"><div><h2 style="margin:0">Mémoire technique, brouillon du ${new Date(m.cree_le).toLocaleDateString("fr-FR", {day:"numeric", month:"long"})} à ${new Date(m.cree_le).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"}).replace(":", "h")}</h2>
    <p class="doux">${n} point${n > 1 ? "s" : ""} à compléter, surlignés en jaune.${m.consignes ? ` Consignes données : « ${esc(trunc(m.consignes, 120))} »` : ""}</p></div>
    <div class="actions" style="margin:0"><button class="btn secondaire" type="button" id="m-voir">Aperçu</button><button class="btn" type="button" id="m-word">Télécharger ${m.original ? "en Word" : "(.html pour Word)"}</button></div></div>
  <form class="formulaire" id="f-mem"><p><label for="contenu">Texte du mémoire</label><span class="helptext">« ## » marque un titre de section, « - » une liste, « | » un tableau.${m.original ? " Le fichier Word d'origine est remplacé par une version .html dès que vous modifiez le texte." : ""}</span>
    <textarea id="contenu" class="editeur">${esc(m.contenu)}</textarea></p>
    <div class="actions"><button class="btn">Enregistrer les modifications</button><a href="#reponse-${a.id}">Retour à la réponse</a></div></form>`);
  $("#f-mem").onsubmit = e => { e.preventDefault(); const t = $("#contenu").value; if (t !== m.contenu) { m.contenu = t; m.original = false; sauver(); } message("Mémoire enregistré."); route(); };
  $("#m-word").onclick = () => telechargerMemoire(a);
  $("#m-voir").onclick = () => apercu({ nom: "Mémoire technique", html: md($("#contenu").value) });
}

/* ================= Dossier ZIP ================= */
async function dossierZip(a, docs, ctr) {
  if (!window.JSZip) { message("La création du ZIP n'est pas disponible dans cette vue.", "error"); return; }
  const z = new JSZip(); let i = 1;
  for (const d of Object.values(docs)) if (d.b64) z.file(`1_Candidature/${String(i++).padStart(2, "0")}_${d.nom}`, b64(d.b64));
  ctr.filter(c => c.statut === "ok" && c.piece && c.piece.data).forEach(c => z.file(`1_Candidature/${String(i++).padStart(2, "0")}_${c.type}_${c.piece.nom_fichier}`, b64(c.piece.data)));
  const m = S.memoires[a.id];
  if (m) { if (m.original && BASE.memoires[a.id]) z.file("2_Offre/Memoire_technique.docx", b64(BASE.memoires[a.id].docx_b64)); else z.file("2_Offre/Memoire_technique.html", htmlMemoire(a, m.contenu)); }
  const l = ["CHECK-LIST DU DOSSIER", `${a.objet} – ${a.acheteur}`, `Date limite : ${a.date_limite ? fdh(a.date_limite) : "non précisée"}`, "",
    ...ctr.map(c => `[${c.statut === "ok" ? "OK" : c.statut === "expiree" ? "EXPIRÉE" : "MANQUANTE"}] ${c.libelle} – ${c.detail}${c.statut === "ok" && !c.piece.data ? " (pièce d'exemple, sans fichier)" : ""}`), "",
    m ? `[OK] Mémoire technique (brouillon, ${nbACompleter(m.contenu)} point(s) à compléter)` : "[MANQUANT] Mémoire technique"];
  z.file("00_Check-list.txt", l.join("\r\n"));
  telecharger(`Dossier_FORMAST_${a.id}.zip`, await z.generateAsync({ type: "blob" }));
}
