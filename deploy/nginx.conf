server {
    listen 80;
    server_name __DOMAINE__;
    client_max_body_size 200M;   # dépôt des DCE (ZIP)

    location /static/ {
        alias /opt/veille-ao/staticfiles/;
    }
    # /media/ n'est PAS servi ici : les pièces (Kbis, RIB, CV) passent par l'application,
    # qui vérifie que l'utilisateur est connecté.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
